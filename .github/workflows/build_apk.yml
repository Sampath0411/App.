name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Enable Android and generate platform
        run: |
          flutter config --enable-android
          ls -la

      - name: Create Android platform
        run: |
          # Remove any partial android dir that might conflict
          rm -rf android
          flutter create . --platforms=android --org=com.zoo.daily_expenses 2>&1

      - name: Verify Android platform
        run: |
          ls -la android/
          cat android/app/build.gradle | head -20

      - name: Build APK (release)
        run: flutter build apk --release 2>&1

      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
