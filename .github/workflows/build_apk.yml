name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Create Flutter project
        run: flutter create daily_expenses --platforms=android --org=com.zoo.daily_expenses

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          path: source_code

      - name: Copy source files
        run: |
          cp source_code/pubspec.yaml daily_expenses/
          cp -r source_code/lib/* daily_expenses/lib/

      - name: Get dependencies
        working-directory: ./daily_expenses
        run: flutter pub get

      - name: Build APK (release)
        working-directory: ./daily_expenses
        run: flutter build apk --release

      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: daily_expenses/build/app/outputs/flutter-apk/app-release.apk
